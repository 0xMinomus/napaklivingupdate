# Production stack: web (nginx) + api (Fastify) + postgres.
# Usage:
#   First deploy:  docker compose -f docker-compose.prod.yml --profile seed up -d --build
#   Updates:       docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-napak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-napak}
      POSTGRES_DB: ${POSTGRES_DB:-napak_living}
    volumes:
      - napak_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-napak} -d ${POSTGRES_DB:-napak_living}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Applies pending Prisma migrations (idempotent, runs on every up).
  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["sh", "-c", "npx prisma migrate deploy --schema server/prisma/schema.prisma"]
    environment: &db_env
      DATABASE_URL: postgresql://${POSTGRES_USER:-napak}:${POSTGRES_PASSWORD:-napak}@postgres:5432/${POSTGRES_DB:-napak_living}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Seeds the catalog. Opt-in (profile) so it does not reset data on every deploy.
  seed:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["sh", "-c", "npx tsx server/prisma/seed.ts"]
    environment:
      <<: *db_env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    profiles: ["seed"]

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      <<: *db_env
      PORT: 3000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  napak_prod_pgdata: