backend:
  name: github
  repo: 0xMinomus/napaklivingupdate
  branch: main
  base_url: https://napaklivingupdate.vercel.app
  auth_endpoint: api/auth

# Uploaded files land in public/Product and are referenced as /Product/...
media_folder: public/Product
public_folder: /Product

collections:
  - name: products
    label: Products
    folder: content/products
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{name}} ({{slug}})'
    fields:
      - { label: 'Name', name: name, widget: string, required: true }
      - { label: 'Slug (URL — lock after first publish, renaming breaks links)', name: slug, widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only'] }
      - { label: 'Display Code (e.g. NL / 007)', name: code, widget: string, required: false }
      - { label: 'SKU', name: sku, widget: string, required: false }
      - { label: 'Subtitle', name: subtitle, widget: string, required: false }
      - { label: 'Description', name: description, widget: text, required: false }
      - { label: 'Materials (e.g. Glazed ceramic, Solid teak wood)', name: materials, widget: string, required: false }
      - { label: 'Dimensions (e.g. Ø 10 · H 15 cm)', name: dimensions, widget: string, required: false }
      - { label: 'Care', name: care, widget: string, required: false }
      - label: Availability
        name: availability
        widget: select
        required: true
        default: made-to-order
        options:
          - { label: 'Ready to ship', value: ready }
          - { label: 'Made to order', value: made-to-order }
      - label: Status
        name: status
        widget: select
        required: true
        default: active
        options:
          - { label: 'Active (visible on site)', value: active }
          - { label: 'Draft (hidden, kept)', value: draft }
      - { label: 'Price (empty = by inquiry)', name: price, widget: string, required: false }
      - { label: 'New badge', name: isNew, widget: boolean, required: false, default: false }
      - { label: 'Featured on home', name: isFeatured, widget: boolean, required: false, default: false }
      - { label: 'Main Image (WebP — filename should match the slug)', name: image, widget: image, required: true }
      - label: Gallery Images
        name: images
        widget: list
        required: false
        fields:
          - { label: 'Image', name: url, widget: image, required: true }
          - { label: 'Alt Text', name: alt, widget: string, required: true }
      - label: Finishes / Variants
        name: variants
        widget: list
        required: false
        field: { label: 'Variant', name: variant, widget: string }
      - label: Category
        name: category
        widget: relation
        collection: categories
        value_field: slug
        display_fields: [name]
        search_fields: [name, slug]
        required: true
      - label: Collections
        name: collections
        widget: list
        required: false
        field:
          label: Collection
          name: collection
          widget: relation
          collection: collections
          value_field: slug
          display_fields: [name]
          search_fields: [name, slug]
      - { label: 'Release Date (empty = treated as newest)', name: createdAt, widget: datetime, required: false }
      - { label: 'Last Updated', name: updatedAt, widget: datetime, required: false }

  - name: categories
    label: Categories
    folder: content/categories
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{name}} ({{slug}})'
    fields:
      - { label: 'Name', name: name, widget: string, required: true }
      - { label: 'Slug (URL — lock after first publish)', name: slug, widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only'] }
      - { label: 'Description', name: description, widget: text, required: false }
      - { label: 'Image', name: image, widget: image, required: false }
      - label: Parent Category
        name: parent
        widget: relation
        collection: categories
        value_field: slug
        display_fields: [name]
        search_fields: [name, slug]
        required: false

  - name: collections
    label: Collections
    folder: content/collections
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{name}} ({{slug}})'
    fields:
      - { label: 'Name', name: name, widget: string, required: true }
      - { label: 'Slug (URL — lock after first publish)', name: slug, widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only'] }
      - { label: 'Description', name: description, widget: text, required: false }
      - { label: 'Image', name: image, widget: image, required: false }
      - { label: 'Eyebrow (e.g. Collection / 01)', name: eyebrow, widget: string, required: false }
      - { label: 'Title Line 1', name: titleLine1, widget: string, required: false }
      - { label: 'Title Line 2', name: titleLine2, widget: string, required: false }
      - { label: 'Lead', name: lead, widget: text, required: false }
      - { label: 'Hero Image', name: heroImage, widget: image, required: false }
      - { label: 'Hero Alt Text', name: heroAlt, widget: string, required: false }
      - { label: 'Story Eyebrow', name: storyEyebrow, widget: string, required: false }
      - { label: 'Story Line 1', name: storyLine1, widget: string, required: false }
      - { label: 'Story Line 2', name: storyLine2, widget: string, required: false }
      - { label: 'Quote', name: quote, widget: text, required: false }

  - name: pages
    label: Pages
    files:
      - name: home
        label: Home Hero
        file: content/pages/home.json
        fields:
          - { label: 'Hero Image (lebar ±1600px, WebP)', name: heroImage, widget: image, required: true }
          - { label: 'Hero Alt Text', name: heroAlt, widget: string, required: false }

  - name: settings
    label: Settings
    files:
      - name: site
        label: Site Contact & Social
        file: content/settings.json
        fields:
          - { label: 'Email', name: email, widget: string, required: true }
          - { label: 'Trade Email', name: tradeEmail, widget: string, required: true }
          - { label: 'WhatsApp URL (https://wa.me/...)', name: whatsapp, widget: string, required: true }
          - { label: 'WhatsApp Label', name: whatsappLabel, widget: string, required: false }
          - { label: 'Instagram URL', name: instagram, widget: string, required: false }
          - { label: 'Studio Address (satu baris per baris)', name: studioAddress, widget: text, required: false }
          - { label: 'Google Maps Embed URL', name: mapsEmbedUrl, widget: string, required: false }
          - { label: 'Google Maps Link', name: mapsUrl, widget: string, required: false }

  - name: lookbook
    label: Lookbook
    folder: content/lookbook
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{mono}} — {{caption}}'
    fields:
      - { label: 'Name', name: name, widget: string, required: true }
      - { label: 'Slug (lock after first publish)', name: slug, widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only'] }
      - { label: 'Image', name: image, widget: image, required: true }
      - { label: 'Alt Text', name: alt, widget: string, required: true }
      - { label: 'Mono Label (e.g. 01 / living slowly)', name: mono, widget: string, required: true }
      - { label: 'Caption', name: caption, widget: string, required: true }
      - { label: 'Order', name: order, widget: number, required: false, default: 0 }
