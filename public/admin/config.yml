backend:
  name: github
  repo: 0xMinomus/napaklivingupdate
  branch: main
  base_url: https://napaklivingupdate.vercel.app
  auth_endpoint: api/auth

# Uploaded files land in public/Product and are referenced as /Product/...
media_folder: public/Product
public_folder: /Product

site_url: https://napaklivingupdate.vercel.app
display_url: https://napaklivingupdate.vercel.app
logo_url: /logo-hitam.png
show_preview_links: true

collections:
  - name: products
    label: Produk
    label_singular: Produk
    description: 'Kelola katalog: tambah produk baru, ubah harga/stok, atau sembunyikan via status Draft.'
    folder: content/products
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{name}} ({{slug}})'
    sortable_fields: ['name', 'createdAt', 'updatedAt']
    view_groups:
      - label: Aktif
        field: status
        pattern: 'active'
      - label: Draft
        field: status
        pattern: 'draft'
    fields:
      - { label: 'Name', name: name, widget: string, required: true }
      - { label: 'Slug (URL — lock after first publish, renaming breaks links)', name: slug, widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only'] }
      - { label: 'Display Code (e.g. NL / 007)', name: code, widget: string, required: false }
      - { label: 'SKU', name: sku, widget: string, required: false }
      - { label: 'Subtitle', name: subtitle, widget: string, required: false }
      - { label: 'Description', name: description, widget: text, required: false }
      - { label: 'Materials (e.g. Glazed ceramic, Solid teak wood)', name: materials, widget: string, required: false }
      - { label: 'Dimensions (e.g. Ø 10 · H 15 cm)', name: dimensions, widget: string, required: false }
      - { label: 'Care', name: care, widget: string, required: false }
      - label: Availability
        name: availability
        widget: select
        required: true
        default: made-to-order
        options:
          - { label: 'Ready to ship', value: ready }
          - { label: 'Made to order', value: made-to-order }
      - label: Status
        name: status
        widget: select
        required: true
        default: active
        options:
          - { label: 'Active (visible on site)', value: active }
          - { label: 'Draft (hidden, kept)', value: draft }
      - { label: 'Price (empty = by inquiry)', name: price, widget: string, required: false }
      - { label: 'New badge', name: isNew, widget: boolean, required: false, default: false }
      - { label: 'Featured on home', name: isFeatured, widget: boolean, required: false, default: false }
      - { label: 'Main Image (WebP — filename should match the slug)', name: image, widget: image, required: true }
      - label: Gallery Images
        name: images
        widget: list
        required: false
        summary: '{{alt}}'
        collapsed: true
        fields:
          - { label: 'Image', name: url, widget: image, required: true }
          - { label: 'Alt Text', name: alt, widget: string, required: true }
      - label: Finishes / Variants
        name: variants
        widget: list
        required: false
        field: { label: 'Variant', name: variant, widget: string }
      - label: Category
        name: category
        widget: relation
        collection: categories
        value_field: slug
        display_fields: [name]
        search_fields: [name, slug]
        required: true
      - label: Collections
        name: collections
        widget: list
        required: false
        field:
          label: Collection
          name: collection
          widget: relation
          collection: collections
          value_field: slug
          display_fields: [name]
          search_fields: [name, slug]
      - { label: 'Release Date (empty = treated as newest)', name: createdAt, widget: datetime, required: false }
      - { label: 'Last Updated', name: updatedAt, widget: datetime, required: false }

  - name: categories
    label: Kategori
    label_singular: Kategori
    description: 'Kelompok produk untuk filter katalog (mis. Vas, Tray). Slug jangan diganti setelah live.'
    folder: content/categories
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{name}} ({{slug}})'
    sortable_fields: ['name']
    fields:
      - { label: 'Name', name: name, widget: string, required: true }
      - { label: 'Slug (URL — lock after first publish)', name: slug, widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only'] }
      - { label: 'Description', name: description, widget: text, required: false }
      - { label: 'Image', name: image, widget: image, required: false }
      - label: Parent Category
        name: parent
        widget: relation
        collection: categories
        value_field: slug
        display_fields: [name]
        search_fields: [name, slug]
        required: false

  - name: collections
    label: Koleksi
    label_singular: Koleksi
    description: 'Koleksi kurasi (Ruang Pagi, Bumi Tenang, ...). Urutan tampil diatur via field Order.'
    folder: content/collections
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{name}} ({{slug}})'
    sortable_fields: ['order', 'name']
    fields:
      - { label: 'Name', name: name, widget: string, required: true }
      - { label: 'Slug (URL — lock after first publish)', name: slug, widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only'] }
      - { label: 'Description', name: description, widget: text, required: false }
      - { label: 'Image', name: image, widget: image, required: false }
      - { label: 'Tagline (short line for cards)', name: tagline, widget: string, required: false }
      - { label: 'Order', name: order, widget: number, required: false, default: 0 }
      - { label: 'Eyebrow (e.g. Collection / 01)', name: eyebrow, widget: string, required: false }
      - { label: 'Title Line 1', name: titleLine1, widget: string, required: false }
      - { label: 'Title Line 2', name: titleLine2, widget: string, required: false }
      - { label: 'Lead', name: lead, widget: text, required: false }
      - { label: 'Hero Image', name: heroImage, widget: image, required: false }
      - { label: 'Hero Alt Text', name: heroAlt, widget: string, required: false }
      - { label: 'Story Eyebrow', name: storyEyebrow, widget: string, required: false }
      - { label: 'Story Line 1', name: storyLine1, widget: string, required: false }
      - { label: 'Story Line 2', name: storyLine2, widget: string, required: false }
      - { label: 'Quote', name: quote, widget: text, required: false }

  - name: pages
    label: Halaman
    description: 'Teks + gambar halaman statis (hero, about, bisnis, kontak). Kosongkan field = kembali ke teks bawaan.'
    files:
      - name: home
        label: Beranda — Hero
        description: 'Gambar besar pembuka halaman depan.'
        file: content/pages/home.json
        fields:
          - { label: 'Hero Image (lebar ±1600px, WebP)', name: heroImage, widget: image, required: true }
          - { label: 'Hero Alt Text', name: heroAlt, widget: string, required: false }

      - name: about
        label: Halaman About
        description: 'Seluruh teks halaman Our Story + daftar Values & Materials.'
        file: content/pages/about.json
        fields:
          - { label: 'Hero Eyebrow', name: heroEyebrow, widget: string, required: false }
          - { label: 'Hero Title Line 1', name: heroTitle1, widget: string, required: false }
          - { label: 'Hero Title Line 2', name: heroTitle2, widget: string, required: false }
          - { label: 'Hero Lead', name: heroLead, widget: text, required: false }
          - { label: 'Hero Image', name: heroImage, widget: image, required: false }
          - { label: 'Hero Alt Text', name: heroAlt, widget: string, required: false }
          - { label: 'Statement Eyebrow', name: statementEyebrow, widget: string, required: false }
          - { label: 'Statement Title Line 1', name: statementTitle1, widget: string, required: false }
          - { label: 'Statement Title Line 2', name: statementTitle2, widget: string, required: false }
          - { label: 'Statement Lead', name: statementLead, widget: text, required: false }
          - { label: 'Story Eyebrow', name: storyEyebrow, widget: string, required: false }
          - { label: 'Story Title Line 1', name: storyTitle1, widget: string, required: false }
          - { label: 'Story Title Line 2', name: storyTitle2, widget: string, required: false }
          - { label: 'Story Image', name: storyImage, widget: image, required: false }
          - { label: 'Story Alt Text', name: storyAlt, widget: string, required: false }
          - { label: 'Story Lead 1', name: storyLead1, widget: text, required: false }
          - { label: 'Story Lead 2', name: storyLead2, widget: text, required: false }
          - { label: 'Philosophy Eyebrow', name: philosophyEyebrow, widget: string, required: false }
          - { label: 'Philosophy Title Line 1', name: philosophyTitle1, widget: string, required: false }
          - { label: 'Philosophy Title Line 2', name: philosophyTitle2, widget: string, required: false }
          - { label: 'Philosophy Lead', name: philosophyLead, widget: text, required: false }
          - label: Values
            name: values
            widget: list
            required: false
            summary: '{{title}}'
            collapsed: true
            fields:
              - { label: 'Title', name: title, widget: string }
              - { label: 'Text', name: text, widget: text }
          - { label: 'Materials Eyebrow', name: materialsEyebrow, widget: string, required: false }
          - { label: 'Materials Title Line 1', name: materialsTitle1, widget: string, required: false }
          - { label: 'Materials Title Line 2', name: materialsTitle2, widget: string, required: false }
          - label: Materials
            name: materials
            widget: list
            required: false
            summary: '{{title}}'
            collapsed: true
            fields:
              - { label: 'Tag (e.g. 01 / ceramic)', name: tag, widget: string }
              - { label: 'Title', name: title, widget: string }
              - { label: 'Text', name: text, widget: text }

      - name: business
        label: Halaman Bisnis
        description: 'Teks halaman Trade + daftar Services.'
        file: content/pages/business.json
        fields:
          - { label: 'Hero Eyebrow', name: heroEyebrow, widget: string, required: false }
          - { label: 'Hero Title Line 1', name: heroTitle1, widget: string, required: false }
          - { label: 'Hero Title Line 2', name: heroTitle2, widget: string, required: false }
          - { label: 'Hero Lead', name: heroLead, widget: text, required: false }
          - { label: 'Hero Image', name: heroImage, widget: image, required: false }
          - { label: 'Hero Alt Text', name: heroAlt, widget: string, required: false }
          - { label: 'Aside Eyebrow', name: asideEyebrow, widget: string, required: false }
          - { label: 'Aside Title', name: asideTitle, widget: string, required: false }
          - { label: 'Aside Text', name: asideText, widget: text, required: false }
          - { label: 'Services Eyebrow', name: servicesEyebrow, widget: string, required: false }
          - { label: 'Services Title Line 1', name: servicesTitle1, widget: string, required: false }
          - { label: 'Services Title Line 2', name: servicesTitle2, widget: string, required: false }
          - label: Services
            name: services
            widget: list
            required: false
            summary: '{{title}}'
            collapsed: true
            fields:
              - { label: 'Mono (e.g. 01 / wholesale)', name: mono, widget: string }
              - { label: 'Title', name: title, widget: string }
              - { label: 'Text', name: text, widget: text }

      - name: contact
        label: Halaman Kontak
        description: 'Teks halaman Contact. Email/WA/alamat ada di menu Settings.'
        file: content/pages/contact.json
        fields:
          - { label: 'Hero Eyebrow', name: heroEyebrow, widget: string, required: false }
          - { label: 'Hero Title Line 1', name: heroTitle1, widget: string, required: false }
          - { label: 'Hero Title Line 2', name: heroTitle2, widget: string, required: false }
          - { label: 'Hero Lead', name: heroLead, widget: text, required: false }
          - { label: 'Info Title', name: infoTitle, widget: string, required: false }
          - { label: 'Info Text', name: infoText, widget: text, required: false }
          - { label: 'Map Label', name: mapLabel, widget: string, required: false }
          - { label: 'Map Name', name: mapName, widget: string, required: false }
          - { label: 'Map Text', name: mapText, widget: text, required: false }

  - name: settings
    label: Pengaturan
    description: 'Kontak + sosmed + alamat yang tampil di footer dan halaman Contact/Bisnis.'
    files:
      - name: site
        label: Kontak & Sosial Media
        file: content/settings.json
        fields:
          - { label: 'Email', name: email, widget: string, required: true }
          - { label: 'Trade Email', name: tradeEmail, widget: string, required: true }
          - { label: 'WhatsApp URL (https://wa.me/...)', name: whatsapp, widget: string, required: true }
          - { label: 'WhatsApp Label', name: whatsappLabel, widget: string, required: false }
          - { label: 'Instagram URL', name: instagram, widget: string, required: false }
          - { label: 'Studio Address (satu baris per baris)', name: studioAddress, widget: text, required: false }
          - { label: 'Google Maps Embed URL', name: mapsEmbedUrl, widget: string, required: false }
          - { label: 'Google Maps Link', name: mapsUrl, widget: string, required: false }

  - name: lookbook
    label: Lookbook
    label_singular: Lookbook
    description: 'Kartu foto jurnal di halaman depan + halaman Lookbook. Urutan via field Order.'
    folder: content/lookbook
    extension: json
    format: json
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{mono}} — {{caption}}'
    sortable_fields: ['order', 'name']
    fields:
      - { label: 'Name', name: name, widget: string, required: true }
      - { label: 'Slug (lock after first publish)', name: slug, widget: string, required: true, pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only'] }
      - { label: 'Image', name: image, widget: image, required: true }
      - { label: 'Alt Text', name: alt, widget: string, required: true }
      - { label: 'Mono Label (e.g. 01 / living slowly)', name: mono, widget: string, required: true }
      - { label: 'Caption', name: caption, widget: string, required: true }
      - { label: 'Order', name: order, widget: number, required: false, default: 0 }
