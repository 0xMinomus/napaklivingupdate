services:
  postgres:
    image: postgres:16-alpine
    container_name: napak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: napak
      POSTGRES_PASSWORD: napak
      POSTGRES_DB: napak_living
    ports:
      - '5432:5432'
    volumes:
      - napak_pgdata:/var/lib/postgresql/data

volumes:
  napak_pgdata: